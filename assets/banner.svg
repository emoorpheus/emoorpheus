<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 210" width="100%" height="210">
  <defs>
    <!-- Card Clip Path -->
    <clipPath id="cardClip">
      <rect x="1" y="1" width="848" height="208" rx="14" />
    </clipPath>

    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#060912" />
      <stop offset="100%" stop-color="#020306" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Badge Background Gradient -->
    <linearGradient id="badgeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.75" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .title { font-size: 34px; font-weight: 800; fill: #f8fafc; letter-spacing: -0.5px; }
    .tagline { font-size: 15px; font-weight: 600; fill: #38bdf8; letter-spacing: 0.1px; }
    .desc { font-size: 12.5px; font-weight: 400; fill: #94a3b8; }
    .badge-text { font-size: 11px; font-weight: 600; fill: #e2e8f0; }
    .ng-badge { font-size: 11px; font-weight: 800; fill: #38bdf8; letter-spacing: 0.5px; }
  </style>

  <!-- Background Card -->
  <rect x="1" y="1" width="848" height="208" rx="14" fill="url(#bgGradient)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Clipped Ambient Elements -->
  <g clip-path="url(#cardClip)">
    <!-- Top Accent Bar -->
    <rect x="1" y="1" width="848" height="3" fill="url(#cyanAccent)" />

    <!-- Ambient Light Effects -->
    <circle cx="780" cy="40" r="140" fill="#38bdf8" opacity="0.08" filter="url(#glow)" />
    <circle cx="90" cy="180" r="110" fill="#818cf8" opacity="0.06" filter="url(#glow)" />

    <!-- Grid Pattern Overlay (Tech aesthetic) -->
    <g opacity="0.06" stroke="#38bdf8" stroke-width="0.5">
      <line x1="600" y1="20" x2="840" y2="20" />
      <line x1="600" y1="50" x2="840" y2="50" />
      <line x1="600" y1="80" x2="840" y2="80" />
      <line x1="600" y1="110" x2="840" y2="110" />
      <line x1="600" y1="140" x2="840" y2="140" />
      <line x1="640" y1="10" x2="640" y2="150" />
      <line x1="680" y1="10" x2="680" y2="150" />
      <line x1="720" y1="10" x2="720" y2="150" />
      <line x1="760" y1="10" x2="760" y2="150" />
      <line x1="800" y1="10" x2="800" y2="150" />
    </g>
  </g>

  <!-- Content Group -->
  <g transform="translate(40, 36)">
    <!-- Brand / Title Row -->
    <g transform="translate(0, 2)">
      <!-- Mini NG Pill -->
      <rect x="0" y="0" width="36" height="20" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" />
      <text x="18" y="14" text-anchor="middle" class="mono ng-badge">NG</text>

      <!-- Main Name -->
      <text x="48" y="16" class="sans title">emoorpheus</text>
      
      <!-- Core Active Status Dot -->
      <circle cx="264" cy="9" r="4.5" fill="#34d399" />
      <circle cx="264" cy="9" r="8" fill="#34d399" opacity="0.3" />
    </g>

    <!-- Tagline -->
    <text x="0" y="54" class="sans tagline">Next-Gen Software for LG webOS, OLED Displays &amp; Home Cinema</text>

    <!-- Subtitle / Mission -->
    <text x="0" y="78" class="sans desc">Deep Luna bus integration • Native Qt/QML overlays • HDR / Dolby Vision tuning • Pure Black OLED UX</text>

    <!-- Feature Badges -->
    <g transform="translate(0, 102)">
      <!-- Badge 1: LG webOS -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="105" height="24" rx="6" fill="url(#badgeBg)" stroke="#334155" stroke-width="1" />
        <circle cx="12" cy="12" r="3.5" fill="#ef4444" />
        <text x="24" y="16" class="sans badge-text">LG webOS</text>
      </g>

      <!-- Badge 2: OLED First -->
      <g transform="translate(113, 0)">
        <rect x="0" y="0" width="138" height="24" rx="6" fill="url(#badgeBg)" stroke="#334155" stroke-width="1" />
        <circle cx="12" cy="12" r="3.5" fill="#38bdf8" />
        <text x="24" y="16" class="sans badge-text">OLED True Black</text>
      </g>

      <!-- Badge 3: HDMI-CEC eARC -->
      <g transform="translate(259, 0)">
        <rect x="0" y="0" width="144" height="24" rx="6" fill="url(#badgeBg)" stroke="#334155" stroke-width="1" />
        <circle cx="12" cy="12" r="3.5" fill="#a855f7" />
        <text x="24" y="16" class="sans badge-text">HDMI-CEC eARC OSD</text>
      </g>

      <!-- Badge 4: Luna Bus & Services -->
      <g transform="translate(411, 0)">
        <rect x="0" y="0" width="132" height="24" rx="6" fill="url(#badgeBg)" stroke="#334155" stroke-width="1" />
        <circle cx="12" cy="12" r="3.5" fill="#34d399" />
        <text x="24" y="16" class="sans badge-text">Luna Bus &amp; QML</text>
      </g>

      <!-- Badge 5: Streaming Plugins -->
      <g transform="translate(551, 0)">
        <rect x="0" y="0" width="128" height="24" rx="6" fill="url(#badgeBg)" stroke="#334155" stroke-width="1" />
        <circle cx="12" cy="12" r="3.5" fill="#f59e0b" />
        <text x="24" y="16" class="sans badge-text">Lampa Plugins</text>
      </g>
    </g>
  </g>
</svg>
